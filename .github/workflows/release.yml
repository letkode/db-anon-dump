name: Release

# Publishes the static binaries when a version tag is pushed:  git tag 0.1.0 && git push origin 0.1.0
on:
  push:
    tags: ['[0-9]*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make build VERSION=${{ github.ref_name }}
      - run: cd dist && sha256sum dbanondump-* > SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* --title "${{ github.ref_name }}" --generate-notes \
            --notes "linux-amd64 and linux-arm64: exercised end to end by the CI (MySQL, MariaDB and PostgreSQL). darwin-arm64: only built, started and validated on a macOS runner (no Docker there); it has not been run against a real database on macOS."
